services:
  # SMTP server to capture outgoing emails
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
    environment:
      - TZ=Pacific/Auckland
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1
    networks:
        default:
          aliases:
            - mailpit.localhost

  cache:
    image: docker.io/valkey/valkey:9
    command: valkey-server --appendonly yes
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      default:
        aliases:
          - cache.localhost

  postgres:
    image: docker.io/postgres:18
    environment:
      - POSTGRES_DB=${DATABASE_NAME}
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U webapp -d webapp"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      default:
        aliases:
          - postgres.localhost

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    command: ["python", "manage.py", "migrate", "--noinput"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./src:/var/app
    # environment:
    #   - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-helloworld.settings}
    #   - SECRET_KEY=${SECRET_KEY}
    #   - DATABASE_URL=${DATABASE_URL}
    #   - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-secret_key}
    env_file:
      - "./.env"
    networks:
      default:
    restart: "no"

  webapp:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
      # target: production
      target: development
    read_only: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      cache:
        condition: service_started
      mailpit:
        condition: service_started
    volumes:
      - ./src:/var/app
    tmpfs:
      - /var/tmp:mode=770,uid=1000,gid=1000
    ports:
      - "5678:5678" # debug port
      - "8000:8000"
    # environment:
    #   - DJANGO_SETTINGS_MODULE=${DJANGO_SETTINGS_MODULE:-helloworld.settings}
    #   - SECRET_KEY=${SECRET_KEY}
    #   - DATABASE_URL=${DATABASE_URL}
    #   - CACHE_URL=${CACHE_URL}
    #   - ALLOWED_HOSTS=${ALLOWED_HOSTS}
    env_file:
      - "./.env"
    networks:
      default:
        aliases:
          - webapp.localhost
