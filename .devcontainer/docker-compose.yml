services:
  # SMTP server to capture outgoing emails
  mailpit:
    image: axllent/mailpit:latest
    environment:
      - TZ=Pacific/Auckland
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1

  cache:
    image: docker.io/valkey/valkey:9
    command: valkey-server --appendonly yes
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
  postgres:
    image: docker.io/postgres:18
    environment:
      POSTGRES_USER: webapp
      POSTGRES_PASSWORD: webapp1234
      POSTGRES_DB: webapp
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  devcontainer:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    init: true
    volumes:
      - "${WORKTREE_DIR:?run the initializeCommand}:/workspace"
      - "${WORKTREE_DIR}:${WORKTREE_DIR}"
      - "${GIT_COMMON_DIR}:${GIT_COMMON_DIR}"
      - venv:/workspace/.venv
      - uv-cache:/home/vscode/.cache/uv
      - precommit-cache:/home/vscode/.cache/pre-commit
    depends_on:
      postgres:
        condition: service_healthy # waits for pg_isready to pass
      cache:
        condition: service_started
      mailpit:
        condition: service_started
    command: sleep infinity
    ports:
      - "127.0.0.1:${DEVSERVER_PORT:?run the initializeCommand}:8000"
    environment:
      INSTANCE_NAME: ${INSTANCE_NAME}
    env_file:
      - "../.env"

volumes:
  venv:
  pgdata:
  uv-cache:
  precommit-cache:
