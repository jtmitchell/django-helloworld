# Personal overrides for devcontainer - safe to modify locally.
services:
  devcontainer:
    dns:
     - 127.0.0.11
     - 100.100.100.100
     - 8.8.8.8

    volumes:
      - ${HOME}/.agents:/home/vscode/.agents
      - ${HOME}/.config/opencode:/home/vscode/.config/opencode
      - ${HOME}/.local/share/opencode:/home/vscode/.local/share/opencode
      - ${HOME}/.local/state/opencode:/home/vscode/.local/state/opencode
      - ${HOME}/.codex:/home/vscode/.codex
      # - ${HOME}/.git-credentials:/home/vscode/.git-credentials:ro
      # - ${HOME}/.gitconfig:/home/vscode/.gitconfig:ro

    build:
     context: .
     dockerfile: Dockerfile.personal
